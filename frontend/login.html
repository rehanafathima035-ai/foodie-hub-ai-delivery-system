<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FoodieHub AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #FF6B35 0%, #FFD54F 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 25px;
        }
    </style>
</head>
<body>

    <div class="auth-card glass shadow-lg text-center" data-aos="zoom-in">
        <a href="/" class="text-decoration-none"><h2 class="fw-bold text-primary-color mb-4"><i class="fas fa-robot me-2"></i>FoodieHub AI</h2></a>
        <h4 class="mb-4 fw-600">Welcome Back!</h4>
        
        <form id="login-form">
            <div class="mb-3 text-start">
                <label class="form-label text-muted">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-0 rounded-start-pill"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control border-0 rounded-end-pill py-3" placeholder="name@example.com" required id="email">
                </div>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-0 rounded-start-pill"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control border-0 rounded-end-pill py-3" placeholder="••••••••" required id="password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-3">Login</button>
        </form>
        
        <p class="mt-4 text-muted">Don't have an account? <a href="/register" class="text-primary-color text-decoration-none fw-bold">Sign Up</a></p>
        <hr class="my-4">
        <a href="/" class="text-muted text-decoration-none small"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
