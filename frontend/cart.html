<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Your Cart | FoodieHub AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light pt-5">
    <nav class="navbar navbar-expand-lg glass fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-robot me-2"></i>FoodieHub AI</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="fw-bold mb-4">Shopping Cart</h2>
        <div class="row g-4">
            <div class="col-lg-8" id="cart-items">
                <!-- Cart items list -->
            </div>
            <div class="col-lg-4">
                <div class="premium-card p-4 shadow-sm sticky-top" style="top:100px">
                    <h5 class="fw-bold mb-4">Price Details</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span id="subtotal" class="fw-bold">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Delivery Fee</span>
                        <span class="text-success fw-bold">$2.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tax (10%)</span>
                        <span id="tax" class="fw-bold">$0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <h6 class="fw-bold">Total Amount</h6>
                        <h6 id="total" class="fw-bold text-primary-color">$0.00</h6>
                    </div>
                    <a href="/checkout" class="btn btn-primary w-100 rounded-pill py-3">Proceed to Checkout</a>
                    <p class="text-center small text-muted mt-3"><i class="fas fa-shield-alt me-1"></i> Secure Payment</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
