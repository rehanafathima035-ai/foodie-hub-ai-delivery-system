<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Explore Restaurants | FoodieHub AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="pt-5">
    <!-- Navbar (Same as index.html) -->
    <nav class="navbar navbar-expand-lg glass fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-robot me-2"></i>FoodieHub AI</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/restaurants">Restaurants</a></li>
                    <li class="nav-item"><a class="nav-link px-3 position-relative" href="/cart"><i class="fas fa-shopping-cart"></i><span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none">0</span></a></li>
                    <li class="nav-item ms-lg-3" id="auth-links"></li>
                    <li class="nav-item ms-3"><button id="theme-toggle" class="btn btn-link text-dark p-0"><i class="fas fa-moon"></i></button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h2 class="fw-bold m-0">All Restaurants</h2>
                <p class="text-muted">Discover the best food near you</p>
            </div>
            <div class="dropdown">
                <button class="btn btn-outline-dark dropdown-toggle rounded-pill" data-bs-toggle="dropdown">Sort By</button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Rating</a></li>
                    <li><a class="dropdown-item" href="#">Delivery Time</a></li>
                </ul>
            </div>
        </div>
        
        <div class="row g-4" id="featured-restaurants">
            <!-- Skeletons -->
            <div class="col-md-4"><div class="skeleton" style="height:350px; border-radius:15px;"></div></div>
            <div class="col-md-4"><div class="skeleton" style="height:350px; border-radius:15px;"></div></div>
            <div class="col-md-4"><div class="skeleton" style="height:350px; border-radius:15px;"></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
