<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admin Dashboard | FoodieHub AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar { height: 100vh; width: 250px; position: fixed; left: 0; top: 0; background-color: var(--text-dark); color: white; padding-top: 30px; }
        .sidebar-link { padding: 15px 30px; color: #aaa; text-decoration: none; display: block; transition: 0.3s; }
        .sidebar-link:hover, .sidebar-link.active { color: white; background: var(--primary-color); }
        .main-content { margin-left: 250px; padding: 40px; }
    </style>
</head>
<body class="bg-light">

    <div class="sidebar">
        <div class="px-4 mb-5"><h4 class="fw-bold text-primary-color">FoodieHub AI</h4><small>Admin Panel</small></div>
        <a href="#" class="sidebar-link active"><i class="fas fa-th-large me-2"></i> Dashboard</a>
        <a href="#" class="sidebar-link"><i class="fas fa-utensils me-2"></i> Restaurants</a>
        <a href="#" class="sidebar-link"><i class="fas fa-box me-2"></i> Orders</a>
        <a href="#" class="sidebar-link"><i class="fas fa-users me-2"></i> Users</a>
        <a href="#" class="sidebar-link"><i class="fas fa-cog me-2"></i> Settings</a>
        <div class="position-absolute bottom-0 w-100 p-4">
            <a href="/" class="btn btn-outline-light btn-sm w-100">Exit Dashboard</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold">Executive Overview</h2>
            <div class="d-flex align-items-center gap-3">
                <span id="admin-name" class="fw-600">Welcome, Admin</span>
                <i class="fas fa-bell text-muted"></i>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="premium-card p-4 text-center">
                    <h6 class="text-muted mb-2">Total Orders</h6>
                    <h3 class="fw-bold m-0" id="total-orders">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="premium-card p-4 text-center border-start border-primary border-5">
                    <h6 class="text-muted mb-2">Total Revenue</h6>
                    <h3 class="fw-bold m-0" id="total-revenue">$0.00</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="premium-card p-4 text-center">
                    <h6 class="text-muted mb-2">Active Users</h6>
                    <h3 class="fw-bold m-0" id="total-users">0</h3>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-8">
                <div class="premium-card p-4 h-100">
                    <h5 class="fw-bold mb-4">Revenue Growth</h5>
                    <canvas id="revenueChart" style="height:300px"></canvas>
                </div>
            </div>
            <div class="col-md-4">
                <div class="premium-card p-4 h-100">
                    <h5 class="fw-bold mb-4">Recent Orders</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <tbody id="recent-orders-table">
                                <!-- Loaded by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { init } from '/static/js/main.js';
        
        // Revenue Chart Initialization
        const ctx = document.getElementById('revenueChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Revenue ($)',
                    data: [1200, 1900, 3000, 2500, 3500, 4200],
                    borderColor: '#FF6B35',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(255, 107, 53, 0.1)'
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
