<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Menu | FoodieHub AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="pt-5">
    <nav class="navbar navbar-expand-lg glass fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-robot me-2"></i>FoodieHub AI</a>
            <div class="ms-auto d-flex align-items-center">
                 <a class="nav-link px-3 position-relative me-3" href="/cart"><i class="fas fa-shopping-cart"></i><span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none">0</span></a>
                 <div id="auth-links"></div>
            </div>
        </div>
    </nav>

    <div class="hero-section py-4 mb-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <img id="restaurant-image" src="" class="img-fluid rounded-lg shadow" alt="Restaurant">
                </div>
                <div class="col-md-9">
                    <h1 id="restaurant-name" class="fw-bold mt-3 mt-md-0">Loading...</h1>
                    <p id="restaurant-cuisine" class="text-muted"></p>
                    <div class="d-flex gap-3">
                        <span class="badge bg-success rounded-pill px-3 py-2"><i class="fas fa-star me-1"></i>4.5</span>
                        <span class="text-muted small"><i class="fas fa-motorcycle me-1"></i>Free Delivery</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-lg-8">
                <h3 class="fw-bold mb-4">Menu Items</h3>
                <div class="row g-4" id="menu-items">
                    <!-- Menu items -->
                </div>
            </div>
            <div class="col-lg-4">
                <div class="glass p-4 rounded-4 shadow-sm sticky-top" style="top:100px">
                    <h5 class="fw-bold mb-3">Order Summary</h5>
                    <div id="mini-cart">
                        <p class="text-muted small">Add items to start your order</p>
                    </div>
                    <hr>
                    <a href="/cart" class="btn btn-primary w-100 rounded-pill">View Full Cart</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
