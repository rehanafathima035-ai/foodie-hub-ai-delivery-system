<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | FoodieHub AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #FF6B35 0%, #FFD54F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 25px;
        }
    </style>
</head>
<body>

    <div class="auth-card glass shadow-lg text-center" data-aos="zoom-in">
        <a href="/" class="text-decoration-none"><h2 class="fw-bold text-primary-color mb-4"><i class="fas fa-robot me-2"></i>FoodieHub AI</h2></a>
        <h4 class="mb-4 fw-600">Create Account</h4>
        
        <form id="register-form">
            <div class="row g-3">
                <div class="col-md-12 text-start">
                    <label class="form-label text-muted">Full Name</label>
                    <input type="text" class="form-control rounded-pill py-2" placeholder="John Doe" required id="full_name">
                </div>
                <div class="col-md-6 text-start">
                    <label class="form-label text-muted">Email</label>
                    <input type="email" class="form-control rounded-pill py-2" placeholder="john@example.com" required id="email">
                </div>
                <div class="col-md-6 text-start">
                    <label class="form-label text-muted">Phone</label>
                    <input type="text" class="form-control rounded-pill py-2" placeholder="+1234567890" id="phone">
                </div>
                <div class="col-md-12 text-start">
                    <label class="form-label text-muted">Address</label>
                    <input type="text" class="form-control rounded-pill py-2" placeholder="123 Street, City" id="address">
                </div>
                <div class="col-md-12 text-start">
                    <label class="form-label text-muted">Password</label>
                    <input type="password" class="form-control rounded-pill py-2" placeholder="••••••••" required id="password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 mt-4">Create Account</button>
        </form>
        
        <p class="mt-4 text-muted">Already have an account? <a href="/login" class="text-primary-color text-decoration-none fw-bold">Login</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
